<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Jess Bakes Sourdough | Admin Dashboard</title>

    <link rel="stylesheet" href="css/admin.css">

  <link rel="icon" type="image/png" href="images/jess-bakes-logo.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jess Bakes">
  <meta name="theme-color" content="#7b2b22">
</head>

<body>

    <!-- LOGIN SCREEN -->

    <div id="loginScreen" class="login-screen">

        <div class="login-card">

            <p class="eyebrow">Jess Bakes Sourdough</p>

            <h1>Admin Dashboard</h1>

            <p class="login-subtitle">

                Sign in to manage your website.

            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        required>

                </div>

                <button
                    type="submit"
                    class="login-btn">

                    Sign In

                </button>

            </form>

            <p id="loginError"></p>

        </div>

    </div>

    <!-- SCRIPTS -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <!-- Registers the installable-app manifest/service worker from
         the login gate too (see js/admin-shell.js's PWA bootstrap) --
         this is the first page a signed-out admin lands on, including
         right after "Add to Home Screen", so the app needs to behave
         like an installed app here as well, not only once signed in.
         Its nav-rendering code no-ops here (no .sidebar-nav on this
         page). -->
    <script src="js/admin-shell.js"></script>

    <script src="js/login.js"></script>

</body>

</html>
