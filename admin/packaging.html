<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Packaging | Jess Bakes Sourdough</title>

<link
    rel="stylesheet"
    href="../css/admin.css">

  <link rel="icon" type="image/png" href="../images/jess-bakes-logo.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jess Bakes">
  <meta name="theme-color" content="#7b2b22">
</head>

<body>

<div class="admin-shell">

   <aside class="sidebar">

    <div class="sidebar-brand">
        <h2>Jess Bakes</h2>
        <span>SOURDOUGH</span>
    </div>

    <nav class="sidebar-nav" aria-label="Admin navigation"></nav>

    <button
        id="logoutBtn"
        class="logout-btn">

        Sign Out

    </button>

</aside>

    <main class="admin-content">

        <header class="admin-header inventory-header">

            <div>

                <h1>Packaging</h1>

                <p>
                    Packaging profiles determine the supplies consumed when fulfilling customer orders.
                </p>

            </div>

            <button
                class="primary-btn"
                id="newPackagingProfile">

                + New Profile

            </button>

        </header>

        <section class="overview-grid">

            <article class="overview-card">

                <span class="overview-label">
                    Profiles
                </span>

                <h2 id="profileCount">
                    0
                </h2>

                <small>
                    Active Profiles
                </small>

            </article>

            <article class="overview-card">

                <span class="overview-label">
                    Packaging Items
                </span>

                <h2 id="packagingItemCount">
                    0
                </h2>

                <small>
                    Inventory Items Used
                </small>

            </article>

            <article class="overview-card">

                <span class="overview-label">
                    Avg Cost
                </span>

                <h2 id="averagePackagingCost">

                    $0.00

                </h2>

                <small>

                    Per Profile

                </small>

            </article>

        </section>

        <section
            id="packagingProfiles"
            class="inventory-card-grid">

        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin-shell.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/packaging.js"></script>

</body>
</html>
