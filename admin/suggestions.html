<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Suggestions | Jess Bakes</title>

<link
rel="stylesheet"
href="../css/admin.css">

</head>

<body>

<div class="admin-shell">

<aside class="sidebar">

<div class="sidebar-brand">

<h2>Jess Bakes</h2>

<span>SOURDOUGH</span>

</div>

<nav class="sidebar-nav" aria-label="Admin navigation"></nav>

<button
id="logoutBtn"
class="logout-btn">

Sign Out

</button>

</aside>

<main class="admin-content">

<header class="admin-header">

<div>

<h1>

Community Suggestions

</h1>

<p>

Customer ideas for future ballots.

</p>

</div>

</header>

<section class="overview-grid">

<article class="overview-card">

<span class="overview-label">

New

</span>

<h2 id="newSuggestionCount">

--

</h2>

</article>

<article class="overview-card">

<span class="overview-label">

Reviewed

</span>

<h2 id="reviewedSuggestionCount">

--

</h2>

</article>

<article class="overview-card">

<span class="overview-label">

Added To Ballot

</span>

<h2 id="ballotSuggestionCount">

--

</h2>

</article>

<article class="overview-card">

<span class="overview-label">

Total Suggestions

</span>

<h2 id="totalSuggestionCount">

--

</h2>

</article>

</section>

<section class="dashboard-card">

<div class="dashboard-card-header">

<h2>

Most Requested

</h2>

</div>

<div id="suggestionsManager">

Loading...

</div>

</section>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="../js/admin-shell.js"></script>
<script src="../js/auth.js"></script>

<script src="../js/admin-suggestions.js"></script>

</body>

</html>
