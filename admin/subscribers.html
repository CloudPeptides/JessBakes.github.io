<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Subscribers | Jess Bakes Sourdough</title>

    <link rel="stylesheet"
          href="../css/admin.css">

  <link rel="icon" type="image/png" href="../images/jess-bakes-logo.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jess Bakes">
  <meta name="theme-color" content="#7b2b22">
</head>

<body>

<div class="admin-shell">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <h2>Jess Bakes</h2>

            <span>SOURDOUGH</span>

        </div>

        <nav class="sidebar-nav" aria-label="Admin navigation"></nav>

    </aside>

    <main class="admin-content">

        <header class="page-header">

            <div>

                <h1>Email Subscribers</h1>

                <p>
                    Customers who've opted in to the weekly menu email. To send
                    or schedule the newsletter itself, see the
                    <a href="email.html">Email</a> page.
                </p>

            </div>

        </header>

        <div class="stats-grid">

            <div class="stat-card">

                <h3>Active</h3>

                <span id="subscriberCount">
                    0
                </span>

            </div>

        </div>

        <div class="card">

            <div class="card-header">

                <input
                    type="text"
                    id="subscriberSearch"
                    placeholder="Search by name or email...">

            </div>

            <div class="table-wrapper">

                <table class="admin-table">

                    <thead>

                    <tr>

                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Joined</th>
                        <th></th>

                    </tr>

                    </thead>

                    <tbody id="subscriberTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="../js/supabase.js"></script>

<script src="../js/admin-shell.js"></script>
<script src="../js/auth.js"></script>

<script src="../js/admin-subscribers.js"></script>

</body>

</html>
